name: O Python tests

on:
  push:
    branches: [master, fork-validation-2026-11-10]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: apodgorny/almasi
          path: almasi

      - name: Checkout Do
        uses: actions/checkout@v4
        with:
          repository: apodgorny/do
          path: do

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Almasi and O
        run: |
          python -m pip install -e ./almasi
          python -m pip install -e ./o
          python -m pip install -e ./do
          python -m pip install jsonschema

      - name: Run ontology tests
        working-directory: o
        run: python root/test.py
