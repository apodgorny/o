name: O Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: apodgorny/almasi
          path: almasi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Almasi, O, and test dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -e ./o
          python -m pip install jsonschema

      - name: Run ontology tests
        working-directory: o
        run: python root/test.py

      - name: Sample Tracker performance (graph mode)
        working-directory: o
        run: python root/tests/_test_performance_tracker.py --size 1000 --rounds 2
