name: O Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout O
        uses: actions/checkout@v4
        with:
          path: o

      - name: Checkout Almasi
        uses: actions/checkout@v4
        with:
          repository: apodgorny/almasi
          path: almasi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Almasi, O, and test dependencies
        run: |
          python -m pip install -e ./almasi
          python -m pip install -e ./o
          python -m pip install jsonschema

      - name: Run Sync correctness tests
        working-directory: o
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'root')
          import o
          type(o).__app__ = o
          o.start()
          import tester
          o.tests.TestSync.run()
          PY

      - name: Run Tracker public API correctness tests
        working-directory: o
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'root')
          import o
          type(o).__app__ = o
          o.start()
          import tester
          o.tests.TestTrackerPublicApi.run()
          PY

      - name: Run ontology tests
        working-directory: o
        run: python root/test.py

      - name: Benchmark baseline Memory and Tracker (master)
        working-directory: o
        run: |
          git fetch origin master
          git restore --source=origin/master --worktree root/services root/t.py root/t_meta.py
          python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3
          python root/tests/_test_performance_tracker.py --size 1000 --rounds 3
          git restore --source=HEAD --worktree root/services root/t.py root/t_meta.py

      - name: Benchmark Memory without IPL and read-only Tracker (PR)
        working-directory: o
        run: |
          python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3
          python root/tests/_test_performance_tracker.py --size 1000 --rounds 3

      - name: Benchmark immediate per-ID notifications and commit confirmation (PR)
        working-directory: o
        run: python root/tests/_test_performance_write_tracking.py --size 1500 --rounds 3 --sync stub
